name: MotoNav

options:
  bundleIdPrefix: com.guiskin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MotoNav:
    type: application
    platform: iOS
    sources:
      - path: MotoNav
    scheme: {}
    info:
      path: MotoNav/Info.plist
      properties:
        CFBundleDisplayName: MotoNav
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - bluetooth-le
        UIBackgroundModes:
          - location
          - bluetooth-central
          - audio
        NSLocationWhenInUseUsageDescription: O MotoNav usa sua localização para calcular a rota e acompanhar a navegação.
        NSLocationAlwaysAndWhenInUseUsageDescription: O MotoNav continua acompanhando a rota com a tela bloqueada durante a navegação.
        NSBluetoothAlwaysUsageDescription: O MotoNav usa Bluetooth para enviar as instruções para a tela da moto.
        NSSpeechRecognitionUsageDescription: O MotoNav entende seus comandos de voz, como ir para um favorito ou tocar uma playlist.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guiskin.motonav
        PRODUCT_NAME: MotoNav
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
