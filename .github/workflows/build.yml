name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project MotoNav.xcodeproj -scheme MotoNav -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee build.log | grep -E "error:|warning:|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/MotoNav.app
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MotoNav.app Payload/
          zip -qry MotoNav.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MotoNav-ipa
          path: ios/MotoNav.ipa
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --title "App iPhone" --notes "MotoNav.ipa para instalar com o Sideloadly"
          gh release upload app ios/MotoNav.ipa --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: ios/build.log

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install "U8g2" "TinyGPSPlus"
          git clone --depth 1 https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-1.75.git waveshare
      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=cdc" \
            --library waveshare/examples/arduino/libraries/GFX_Library_for_Arduino \
            --output-dir out firmware/MotoNav
      - uses: actions/upload-artifact@v4
        with:
          name: MotoNav-firmware
          path: out/MotoNav.ino.merged.bin
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/MotoNav.ino.merged.bin MotoNav-firmware.bin
          gh release view firmware >/dev/null 2>&1 || gh release create firmware --title "Firmware da placa" --notes "Gravar no endereço 0x0"
          gh release upload firmware MotoNav-firmware.bin --clobber
